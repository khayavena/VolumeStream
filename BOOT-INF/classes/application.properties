# -- Server --------------------------------------------------------------------
server.port=8081

# Tomcat thread pool - tune for your CPU core count and expected concurrency.
# max=400 handles 400 simultaneous HTTP connections before queuing.
# accept-count is the OS accept queue depth beyond max.
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=200
server.tomcat.connection-timeout=5000


# -- JWT -----------------------------------------------------------------------
# Base64-encoded 256-bit secret.  Generate a new one for production:
#   openssl rand -base64 32
# SECURITY: always supply JWT_SECRET as an environment variable in production.
# The fallback below is a DEV-ONLY default ? it is intentionally NOT used when
# application-prod.properties is active (that file requires JWT_SECRET with no fallback).
jwt.secret=${JWT_SECRET:mks8K4ZfO3cKXZgV1P9h8RQdOrD39WSlUUb7nDNcAzcHiQeInuShFzL0e5x8rLBTk2YvHZwTkPTo9XwQcb9zzA==}
jwt.issuer=auth-pulse-service

jwt.api-versions=v1,v2
jwt.unsecured-urls=/auth/**,/swagger-ui/**,/v3/api-docs/**,/api/v1/health,/api/v1/proxy/**,/api/v1/manifest/*/key,/api/v1/manifest/hls/*/*,/actuator/health
jwt.secured-urls=/api/{version}/**,/admin/**,/actuator/**

# -- Licence -------------------------------------------------------------------
# Two separate HMAC keys ? one per concern. A compromise of one does NOT
# compromise the other.  Both must be >= 32 characters.
# SECURITY: always supply both as environment variables in production.
# The fallbacks below are DEV-ONLY defaults ? never used when prod profile is active.

# Signs / verifies short-lived HLS/DASH stream tokens (StreamTokenService).
license.token-key=${LICENSE_TOKEN_KEY:dev-only-insecure-token-key-change-for-production!!}

# Stream-token lifetime in seconds (default 24 h = 86 400 s).
# Controls:
#   - The expiry embedded inside each signed stream token (StreamTokenService)
#   - The expiry set in SessionController when a session is started
#   - The Caffeine "sessions" cache TTL (CacheConfig, set to this value + 1 h)
#   - The Caffeine manifest caches in ManifestService / UserManifestService
# All four values are driven by this single property so they stay in sync.
# Increase to allow longer viewing sessions; decrease for tighter security.
license.token.ttl-seconds=86400

# Derives per-segment AES-128 keys (KeyDerivationService).
license.segment-key=${LICENSE_SEGMENT_KEY:dev-only-insecure-segment-key-change-for-production!!}

# Keys the HMAC-SHA256 watermark PRNG (WatermarkService).
# Separate from the segment key so a key compromise doesn't expose both concerns.
license.watermark-key=${LICENSE_WATERMARK_KEY:dev-only-insecure-watermark-key-change-for-production!!}

# Absolute path to the directory containing unencrypted video segments.
# Layout: {segment-storage-path}/{videoId}/{segmentIndex:05d}.ts
# Example: /var/volumestream/segments/video123/00000.ts
license.segment-storage-path=./segments

# -- Video ingestion (FFmpeg) --------------------------------------------------
# Path to the ffmpeg binary.  Use the full path if ffmpeg is not on $PATH.
# Example (Docker): license.ffmpeg.path=/usr/bin/ffmpeg
license.ffmpeg.path=ffmpeg

# Target HLS segment duration in seconds.  Changing this after ingestion
# has run will not affect already-segmented videos.
license.ffmpeg.segment-duration=6

# Enable or disable DASH ingestion + manifest generation. When false, the
# application will only generate and serve HLS streams.
license.dash.enabled=true

# -- Bento4 toolchain ----------------------------------------------------------
# Path to the mp4fragment binary (Bento4).  Used in step 2 of the DASH pipeline
# to produce a fragmented MP4 before passing it to mp4dash.
# Example (Docker / custom install): license.bento4.mp4fragment-path=/opt/bento4/bin/mp4fragment
license.bento4.mp4fragment-path=${BENTO4_MP4FRAGMENT:mp4fragment}

# Path to the mp4dash binary (Bento4).  Packages the fragmented MP4 into
# DASH AdaptationSets (video + audio) with a standards-compliant MPD.
# Example (Docker / custom install): license.bento4.mp4dash-path=/opt/bento4/bin/mp4dash
license.bento4.mp4dash-path=${BENTO4_MP4DASH:mp4dash}

# Manifest generation retry: how many times to re-attempt building an HLS or
# DASH manifest before returning a 500 (useful while FFmpeg ingestion is running).
license.manifest.retry-attempts=3
# Milliseconds between each retry attempt.
license.manifest.retry-delay-ms=2000

# When true, all existing segment directories are wiped on startup and every
# video is re-downloaded and re-segmented with the current FFmpeg pipeline.
# Set to false once segments are healthy to avoid re-encoding on every restart.
license.ingestion.reseed-on-start=false

# Number of simultaneous download+FFmpeg workers during Phase 2 background ingestion.
# 0 = auto (defaults to number of available CPU cores, minimum 2).
# Increase on machines with fast I/O and many cores; decrease to reduce peak CPU load.
license.ingestion.parallel-threads=0

# -- MongoDB -------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://venacloud:greenbird@cluster0-qdiyr.mongodb.net/catalogdb?retryWrites=true&w=majority}
spring.data.mongodb.database=${MONGODB_DATABASE:catalogdb}
spring.data.mongodb.repositories.type=auto

# -- Async segment executor ----------------------------------------------------
# Tune based on available CPU cores. Each in-flight segment request occupies one
# thread here while watermarking + AES encryption runs.
license.async.core-pool-size=8
license.async.max-pool-size=64
license.async.queue-capacity=200

# -- Session cleanup -----------------------------------------------------------
# How often to deactivate expired sessions in the DB (milliseconds). Default = 15 min.
license.cleanup.interval-ms=900000

# -- Actuator ------------------------------------------------------------------
# Dev: expose health + info + metrics. Restrict to health-only in prod profile.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# -- Scheduling ----------------------------------------------------------------
spring.task.scheduling.pool.size=2

# -- Logging -------------------------------------------------------------------
logging.level.com.vdigital.streamvault=DEBUG

# -- CORS ----------------------------------------------------------------------
# Comma-separated list of allowed origins. Override with env var CORS_ALLOWED_ORIGINS in production.
# NEVER set this to * in production ? that allows any origin to make credentialed requests.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

# -- Rate limiting -------------------------------------------------------------
# Fixed-window throttle on /api/v1/proxy/** and /api/v1/manifest/*/key.
# Increase max-requests for high-traffic dev environments or tune via env vars in prod.
security.rate-limit.window-ms=60000
security.rate-limit.max-requests=240
